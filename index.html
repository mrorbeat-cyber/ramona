<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramona English - Natural Hands-Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overscroll-behavior-y: none; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .app-container { height: 100vh; height: 100dvh; }
        .pulse-active { animation: pulse-glow 1.5s infinite; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden">
    <div class="app-container max-w-md mx-auto w-full flex flex-col bg-slate-900 shadow-2xl relative border-x border-slate-800">
        
        <!-- HEADER -->
        <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3">
                <div id="avatar-icon" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow">R</div>
                <div>
                    <h1 class="font-bold text-sm text-slate-100 flex items-center gap-1">
                        <span id="tutor-name">Ramona</span> 
                    </h1>
                    <span id="level-display" class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">
                        Modo Manos Libres | Básico
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Botón para alternar modo manos libres automático o manual -->
                <button onclick="toggleHandsFreeMode()" id="mode-toggle-btn" class="text-xs bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg shadow font-medium" title="Cambiar Modo">Auto: ON</button>
                <button onclick="toggleSettingsModal()" class="text-slate-300 hover:text-white p-2 rounded-lg bg-slate-700/60"><i class="fa-solid fa-gear text-base"></i></button>
            </div>
        </header>

        <!-- VENTANA FLOTANTE DE AJUSTES (Niveles y Voces) -->
        <div id="settings-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-4 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="font-bold text-sm text-slate-100"><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>Ajustes de Ramona</h2>
                    <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs text-slate-400 font-medium">Nivel de Conversación:</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setLevel('Básico')" id="lvl-basico" class="py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Básico</button>
                        <button onclick="setLevel('Medio')" id="lvl-medio" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold">Medio</button>
                        <button onclick="setLevel('Avanzado')" id="lvl-avanzado" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold">Avanzado</button>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs text-slate-400 font-medium">Velocidad:</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setSpeed(0.8)" id="spd-08" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs">0.8x</button>
                        <button onclick="setSpeed(1.0)" id="spd-10" class="py-1.5 rounded-lg bg-indigo-600 text-white text-xs">1.0x</button>
                        <button onclick="setSpeed(1.2)" id="spd-12" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs">1.2x</button>
                    </div>
                </div>
                <button onclick="toggleSettingsModal()" class="w-full py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Aplicar y Cerrar</button>
            </div>
        </div>

        <!-- CHAT FEED -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950/50">
            <div class="flex items-start space-x-2">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                    <p>Hello Mario! I am Ramona. Conecta tus audífonos. El modo automático está activo: háblame con total naturalidad sin tocar nada y te responderé como una persona real.<br><br>How is your day going?</p>
                </div>
            </div>
        </div>

        <!-- INDICADOR INFERIOR DE ESTADO HUMANO -->
        <div class="bg-slate-800 border-t border-slate-700 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
                <span id="status-label" class="text-xs text-slate-300 font-medium">Escuchando a través de tus audífonos...</span>
            </div>
            <button onclick="manualTriggerListen()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow">Hablar Ahora</button>
        </div>

    </div>

    <script>
        const synth = window.speechSynthesis;
        let recognition = null;
        let isHandsFree = true;
        let speechRate = 1.0;
        let currentLevel = "Básico";
        let isSpeaking = false;
        let voicesLoaded = false;
        let conversationTurn = 0;

        function loadVoices() {
            synth.getVoices();
            voicesLoaded = true;
        }
        synth.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleSettingsModal() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        // Inicializar reconocimiento optimizado para auriculares y flujo continuo
        function initContinuousRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz continuo. Usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (isSpeaking) return;
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-rose-500 pulse-active";
                document.getElementById('status-label').innerText = "Te escucho atentamente...";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.trim();
                if (text) {
                    processHumanDialogue(text);
                }
            };

            recognition.onerror = () => {
                resumeListening();
            };

            recognition.onend = () => {
                if (isHandsFree && !isSpeaking) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e){}
                    }, 300);
                }
            };

            // Arrancar escucha inicial
            try {
                recognition.start();
            } catch(e){}
        }

        function resumeListening() {
            if (isHandsFree && !isSpeaking) {
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-500 animate-ping";
                document.getElementById('status-label').innerText = "Escuchando a través de tus audífonos...";
                try { recognition.start(); } catch(e){}
            }
        }

        function manualTriggerListen() {
            if (synth.speaking) synth.cancel();
            try {
                recognition.stop();
            } catch(e){}
            setTimeout(() => {
                try { recognition.start(); } catch(e){}
            }, 200);
        }

        function toggleHandsFreeMode() {
            isHandsFree = !isHandsFree;
            const btn = document.getElementById('mode-toggle-btn');
            if (isHandsFree) {
                btn.innerText = "Auto: ON";
                btn.className = "text-xs bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg shadow font-medium";
                resumeListening();
            } else {
                btn.innerText = "Auto: OFF";
                btn.className = "text-xs bg-slate-600 text-white px-2.5 py-1.5 rounded-lg shadow font-medium";
                try { recognition.stop(); } catch(e){}
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-slate-500";
                document.getElementById('status-label').innerText = "Modo manual (Usa 'Hablar Ahora')";
            }
        }

        function setLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('level-display').innerText = `Modo Manos Libres | ${lvl}`;
            ['Básico', 'Medio', 'Avanzado'].forEach(l => {
                const b = document.getElementById(`lvl-${l.toLowerCase()}`);
                if (l === lvl) b.className = "py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold";
                else b.className = "py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold";
            });
            speakRamonaNatural(`Switched to ${lvl} level. Let's keep our conversation flowing.`);
        }

        function setSpeed(rate) {
            speechRate = rate;
            [0.8, 1.0, 1.2].forEach(r => {
                const b = document.getElementById(`spd-${r.toString().replace('.', '')}`);
                if (r === rate) b.className = "py-1.5 rounded-lg bg-indigo-600 text-white text-xs";
                else b.className = "py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs";
            });
            speakRamonaNatural(`Speed adjusted.`);
        }

        // MOTOR DE VOZ NATURAL (Redirige audio perfecto a audífonos)
        function speakRamonaNatural(text) {
            isSpeaking = true;
            try { recognition.stop(); } catch(e){}
            if (synth.speaking) synth.cancel();

            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-indigo-500 animate-bounce";
            document.getElementById('status-label').innerText = "Ramona está hablando...";

            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = speechRate;
            utter.pitch = 1.1; // Tono cálido de mujer
            utter.lang = 'en-US';

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.includes('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('karen'))) || voices[0];
            if (voice) utter.voice = voice;

            utter.onend = () => {
                isSpeaking = false;
                if (isHandsFree) {
                    setTimeout(() => resumeListening(), 400);
                }
            };

            synth.speak(utter);
        }

        // DIÁLOGO HUMANO Y ABIERTO (Libre de bucles robóticos)
        function processHumanDialogue(text) {
            const chatContainer = document.getElementById('chat-container');

            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-2">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm p-3.5 max-w-[85%] text-sm shadow">
                        <p>${escapeHtml(text)}</p>
                        <span class="text-[10px] text-indigo-200 mt-1 block text-right">Mario</span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            conversationTurn++;
            let responseText = "";

            const poolBasic = [
                `That's awesome, Mario! Tell me more about what you like doing on your free time.`,
                `I see! How long have you enjoyed doing that?`,
                `That sounds really nice. What is another hobby you have?`,
                `Thanks for sharing that with me, Mario. Do you usually do that every day?`
            ];

            const poolMedium = [
                `That's a very interesting point of view, Mario. What do you think is the main reason behind that?`,
                `Makes total sense! Have you always felt that way, or did something change recently?`,
                `I appreciate your perspective. How does that usually fit into your daily schedule?`
            ];

            const poolAdvanced = [
                `That's quite a thoughtful perspective, Mario. What underlying factors do you think contribute most to that situation?`,
                `A fascinating observation. How do you usually handle challenges when working on projects like that?`,
                `An insightful comment indeed. Could you elaborate on how that impacts your long-term goals?`
            ];

            if (currentLevel === "Básico") {
                responseText = poolBasic[conversationTurn % poolBasic.length];
            } else if (currentLevel === "Medio") {
                responseText = poolMedium[conversationTurn % poolMedium.length];
            } else {
                responseText = poolAdvanced[conversationTurn % poolAdvanced.length];
            }

            setTimeout(() => {
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                            <p>${escapeHtml(responseText)}</p>
                            <span class="text-[10px] text-slate-500 mt-1 block text-right">Ramona</span>
                        </div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                speakRamonaNatural(responseText);
            }, 300);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            setTimeout(() => {
                initContinuousRecognition();
                speakRamonaNatural("Hello Mario! I am Ramona. Put on your headphones, relax, and let's have a completely normal conversation. How is your day going?");
            }, 800);
        };
    </script>
</body>
</html>
