<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramona English - Continuous Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overscroll-behavior-y: none; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .app-container { height: 100vh; height: 100dvh; }
        .pulse-live { animation: live-glow 1.5s infinite; }
        @keyframes live-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden">
    <div class="app-container max-w-md mx-auto w-full flex flex-col bg-slate-900 shadow-2xl relative border-x border-slate-800">
        
        <!-- HEADER -->
        <header class="bg-slate-800 border-b border-slate-700 px-3 py-3 flex items-center justify-between z-10">
            <div class="flex items-center space-x-2.5">
                <div id="avatar-icon" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow">R</div>
                <div>
                    <h1 class="font-bold text-sm text-slate-100 flex items-center gap-1">
                        <span id="tutor-name">Ramona</span> 
                    </h1>
                    <span id="level-display" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">
                        Manos Libres Continuo | Básico
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-1">
                <button onclick="toggleContinuousState()" id="pause-play-btn" class="text-xs bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg shadow font-medium">Pausar</button>
                <button onclick="toggleSettingsModal()" class="text-slate-300 hover:text-white p-2 rounded-lg bg-slate-700/60"><i class="fa-solid fa-gear text-base"></i></button>
            </div>
        </header>

        <!-- VENTANA FLOTANTE DE AJUSTES -->
        <div id="settings-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-4 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="font-bold text-sm text-slate-100"><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>Ajustes</h2>
                    <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs text-slate-400 font-medium">Nivel:</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setLevel('Básico')" id="modal-btn-básico" class="py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Básico</button>
                        <button onclick="setLevel('Medio')" id="modal-btn-medio" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold">Medio</button>
                        <button onclick="setLevel('Avanzado')" id="modal-btn-avanzado" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold">Avanzado</button>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs text-slate-400 font-medium">Velocidad:</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setSpeed(0.8)" id="speed-08" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs">0.8x</button>
                        <button onclick="setSpeed(1.0)" id="speed-10" class="py-1.5 rounded-lg bg-indigo-600 text-white text-xs">1.0x</button>
                        <button onclick="setSpeed(1.2)" id="speed-12" class="py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs">1.2x</button>
                    </div>
                </div>
                <button onclick="toggleSettingsModal()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">Cerrar</button>
            </div>
        </div>

        <!-- CHAT FEED -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950/50">
            <div class="flex items-start space-x-2">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                    <p>Hello Mario! I am Ramona. El modo continuo está activo. Conecta tus audífonos y habla con total libertad; te escucharé y responderé sin que toques ningún botón.<br><br>How is your day going?</p>
                </div>
            </div>
        </div>

        <!-- INDICADOR INFERIOR DE ESTADO CONTINUO -->
        <div class="bg-slate-800 border-t border-slate-700 px-4 py-3 flex items-center justify-between text-xs text-slate-300">
            <div class="flex items-center space-x-2.5">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500 pulse-live"></div>
                <span id="status-label">Escuchando en vivo... Habla cuando gustes</span>
            </div>
            <button onclick="forceRestartListening()" class="bg-slate-700 hover:bg-slate-600 text-white px-2.5 py-1 rounded">Reiniciar</button>
        </div>

    </div>

    <script>
        const synth = window.speechSynthesis;
        let recognition = null;
        let isRunning = true;
        let isSpeaking = false;
        let speechRate = 1.0;
        let currentLevel = "Básico";
        let isMaleVoice = false;
        let voicesList = [];
        let conversationTurn = 0;

        function loadVoices() { voicesList = synth.getVoices(); }
        synth.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleSettingsModal() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        // MOTOR DE ESCUCHA CONTINUA AUTOMATIZADA
        function startContinuousEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz continuo. Usa Google Chrome o Safari actualizado.");
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (!isSpeaking && isRunning) {
                    document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-500 pulse-live";
                    document.getElementById('status-label').innerText = "Escuchando... Habla libremente";
                }
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.trim();
                if (text && !isSpeaking) {
                    processContinuousDialogue(text);
                }
            };

            recognition.onerror = () => {
                if (isRunning && !isSpeaking) {
                    setTimeout(() => restartRecognitionSafe(), 500);
                }
            };

            recognition.onend = () => {
                // Ciclo automático: si Ramona no está hablando y el modo está activo, vuelve a escuchar solo
                if (isRunning && !isSpeaking) {
                    setTimeout(() => restartRecognitionSafe(), 300);
                }
            };

            restartRecognitionSafe();
        }

        function restartRecognitionSafe() {
            if (!isRunning || isSpeaking) return;
            try {
                recognition.start();
            } catch(e) {
                // Ya estaba activo o esperando ciclo
            }
        }

        function toggleContinuousState() {
            isRunning = !isRunning;
            const btn = document.getElementById('pause-play-btn');
            if (isRunning) {
                btn.innerText = "Pausar";
                btn.className = "text-xs bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg shadow font-medium";
                startContinuousEngine();
            } else {
                btn.innerText = "Reanudar";
                btn.className = "text-xs bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg shadow font-medium";
                try { recognition.stop(); } catch(e){}
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-slate-500";
                document.getElementById('status-label').innerText = "En pausa (Toca Reanudar)";
            }
        }

        function forceRestartListening() {
            if (synth.speaking) synth.cancel();
            isSpeaking = false;
            startContinuousEngine();
        }

        function setLevel(level) {
            currentLevel = level;
            document.getElementById('level-display').innerText = `Manos Libres Continuo | ${currentLevel}`;
            ['Básico', 'Medio', 'Avanzado'].forEach(lvl => {
                const b = document.getElementById(`modal-btn-${lvl.toLowerCase()}`);
                if (lvl === level) b.className = "py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold";
                else b.className = "py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold";
            });
            speakRamona(`Switched to ${level} level. Let's continue.`);
        }

        function setSpeed(rate) {
            speechRate = rate;
            [0.8, 1.0, 1.2].forEach(r => {
                const b = document.getElementById(`speed-${r.toString().replace('.', '')}`);
                if (r === rate) b.className = "py-1.5 rounded-lg bg-indigo-600 text-white text-xs";
                else b.className = "py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs";
            });
            speakRamona("Speed adjusted.");
        }

        // HABLA DE RAMONA Y GESTIÓN DE AUDIO PARA AUDÍFONOS
        function speakRamona(text) {
            isSpeaking = true;
            try { recognition.stop(); } catch(e){} // Pausa el mic mientras habla para evitar eco en audífonos
            if (synth.speaking) synth.cancel();

            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-indigo-500 animate-bounce";
            document.getElementById('status-label').innerText = "Ramona está hablando...";

            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.rate = speechRate;
            utterThis.pitch = 1.2;
            utterThis.lang = 'en-US';

            loadVoices();
            const voice = voicesList.find(v => v.lang.includes('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha'))) || voicesList[0];
            if (voice) utterThis.voice = voice;

            utterThis.onend = () => {
                isSpeaking = false;
                if (isRunning) {
                    // Al terminar de hablar, reactiva automáticamente la escucha manos libres
                    setTimeout(() => restartRecognitionSafe(), 400);
                }
            };

            synth.speak(utterThis);
        }

        // DIÁLOGO CONTINUO ABIERTO Y HUMANO
        function processContinuousDialogue(text) {
            const chatContainer = document.getElementById('chat-container');

            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-2">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm p-3.5 max-w-[85%] text-sm shadow">
                        <p>${escapeHtml(text)}</p>
                        <span class="text-[10px] text-indigo-200 mt-1 block text-right">Mario</span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            conversationTurn++;
            let responseText = "";

            const poolBasic = [
                `That's awesome, Mario! Tell me more about what you like doing on your free time.`,
                `I see! How long have you enjoyed doing that?`,
                `That sounds really nice. What is another hobby you have?`,
                `Thanks for sharing that with me, Mario. Do you usually do that every day?`
            ];

            const poolMedium = [
                `That's a very interesting point of view, Mario. What do you think is the main reason behind that?`,
                `Makes total sense! Have you always felt that way, or did something change recently?`,
                `I appreciate your perspective. How does that usually fit into your daily schedule?`
            ];

            const poolAdvanced = [
                `That's quite a thoughtful perspective, Mario. What underlying factors do you think contribute most to that situation?`,
                `A fascinating observation. How do you usually handle challenges when working on projects like that?`,
                `An insightful comment indeed. Could you elaborate on how that impacts your long-term goals?`
            ];

            if (currentLevel === "Básico") {
                responseText = poolBasic[conversationTurn % poolBasic.length];
            } else if (currentLevel === "Medio") {
                responseText = poolMedium[conversationTurn % poolMedium.length];
            } else {
                responseText = poolAdvanced[conversationTurn % poolAdvanced.length];
            }

            setTimeout(() => {
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                            <p>${escapeHtml(responseText)}</p>
                            <span class="text-[10px] text-slate-500 mt-1 block text-right">Ramona</span>
                        </div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                speakRamona(responseText);
            }, 300);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            setTimeout(() => {
                startContinuousEngine();
                speakRamona("Hello Mario! I am Ramona. Continuous hands-free mode is active. Put on your headphones and let's talk normally. How is your day going?");
            }, 800);
        };
    </script>
</body>
</html>
