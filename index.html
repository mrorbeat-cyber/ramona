<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramona English - Voz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overscroll-behavior-y: none; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .app-container { height: 100vh; height: 100dvh; }
        @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.1); background-color: #ef4444; } 100% { transform: scale(1); } }
        .recording { animation: pulse-red 1.5s infinite; background-color: #dc2626 !important; }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden">
    <div class="app-container max-w-md mx-auto w-full flex flex-col bg-slate-900 shadow-2xl relative border-x border-slate-800">
        
        <!-- HEADER -->
        <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow">R</div>
                <div>
                    <h1 class="font-bold text-base text-slate-100 flex items-center gap-1">
                        Ramona <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30">Voz Activa</span>
                    </h1>
                    <p class="text-xs text-slate-400">Mario Orbea - Inglés Básico</p>
                </div>
            </div>
            <button onclick="toggleSettings()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-gear text-lg"></i></button>
        </header>

        <!-- CHAT -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950/50">
            <div class="flex items-start space-x-2">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                    <p>Hello Mario Orbea! I am Ramona. Puedes escribir o tocar el botón del micrófono para hablarme en inglés.<br><br>Let's start: How are you today?</p>
                    <button onclick="speakText('Hello Mario Orbea! I am Ramona. Let\'s start: How are you today?')" class="mt-2 text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                        <i class="fa-solid fa-volume-high"></i> Escuchar a Ramona
                    </button>
                </div>
            </div>
        </div>

        <!-- PANEL DE CONFIGURACIÓN RÁPIDA -->
        <div id="settings-panel" class="hidden bg-slate-800 border-t border-slate-700 p-3 text-xs space-y-2">
            <div class="font-semibold text-slate-300 flex justify-between items-center">
                <span>Comandos Rápidos:</span>
                <button onclick="toggleSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendQuick('Por favor, baja la velocidad y usa frases más cortas.')" class="bg-slate-700 p-2 rounded text-left hover:bg-slate-600">🐢 Bajar velocidad</button>
                <button onclick="sendQuick('Quiero cambiar al nivel medio ahora.')" class="bg-slate-700 p-2 rounded text-left hover:bg-slate-600">📈 Nivel Medio</button>
            </div>
        </div>

        <!-- FOOTER / INPUT CON MICRÓFONO -->
        <footer class="bg-slate-800 border-t border-slate-700 p-3">
            <form onsubmit="handleSend(event)" class="flex items-center space-x-2">
                <!-- Botón de Micrófono para Hablar -->
                <button type="button" id="mic-btn" onclick="toggleSpeechRecognition()" title="Hablar" class="bg-slate-700 hover:bg-slate-600 text-white w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 transition-colors shadow">
                    <i class="fa-solid fa-microphone text-base"></i>
                </button>
                <input type="text" id="user-input" placeholder="Escribe o usa el micrófono..." autocomplete="off"
                    class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 shadow"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </footer>
    </div>

    <script>
        function toggleSettings() { document.getElementById('settings-panel').classList.toggle('hidden'); }
        function sendQuick(t) { document.getElementById('user-input').value = t; toggleSettings(); document.getElementById('user-input').focus(); }

        // Función para que el celular hable (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Detener audio anterior
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // Inglés para Ramona
                utterance.rate = 0.9; // Velocidad natural y clara
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Tu navegador no soporta lectura de voz.");
            }
        }

        // Función para hablarle a la app por micrófono (Speech-to-Text)
        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("El reconocimiento de voz no está soportado en este navegador. Prueba usando Safari en iPhone o Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Idioma que vas a hablar (inglés)
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('recording');

            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('user-input').value = speechToText;
                micBtn.classList.remove('recording');
            };

            recognition.onerror = function(event) {
                micBtn.classList.remove('recording');
                alert("Error al reconocer la voz. Inténtalo de nuevo.");
            };

            recognition.onspeechend = function() {
                micBtn.classList.remove('recording');
                recognition.stop();
            };
        }

        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const textUser = input.value.trim();
            if(!textUser) return;
            
            const c = document.getElementById('chat-container');
            
            // Mensaje usuario
            c.innerHTML += `<div class="flex items-start justify-end space-x-2"><div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm p-3.5 max-w-[85%] text-sm shadow">${escapeHtml(textUser)}</div></div>`;
            input.value = '';
            c.scrollTop = c.scrollHeight;

            // Respuesta simulada de Ramona con voz integrada
            setTimeout(() => {
                const respuestaRamona = `Good job! Let's practice more about: "${textUser}". Repeat after me.`;
                c.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">R</div>
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-3.5 max-w-[85%] text-sm text-slate-200 shadow-md">
                            <p>${escapeHtml(respuestaRamona)}</p>
                            <button onclick="speakText('${escapeHtml(respuestaRamona).replace(/'/g, "\\'")}')" class="mt-2 text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                                <i class="fa-solid fa-volume-high"></i> Escuchar a Ramona
                            </button>
                        </div>
                    </div>`;
                c.scrollTop = c.scrollHeight;
                
                // Hablar automáticamente la respuesta
                speakText(respuestaRamona);
            }, 800);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
